# DO NOT EDIT -- overwritten on every update.
#
# Agent customization surface for code-audit.
# Team overrides:     {project-root}/_bmad/custom/code-audit.toml
# Personal overrides: {project-root}/_bmad/custom/code-audit.user.toml

[agent]

# --- Metadata (install-time roster contract) ---
# Consumed by module.yaml:agents[] and `[agents.<code>]` in central config.

code = "code-audit"
name = "Code Auditor"
title = "Code Auditor"
icon = "🔍"
description = "代码安全审计智能体 — 自动发现项目中的安全漏洞和业务逻辑风险"
agent_type = "memory"

# --- Persistent Context (auto-loaded on first session) ---
# Files matching these globs are automatically read when the agent is first
# invoked in a project, before any user interaction. Use for org/project
# security policies, baseline configurations, or audit scope definitions.

persistent_facts = [
    "file:{project-root}/**/project-context.md",
    "file:{project-root}/SECURITY.md",
    "file:{project-root}/.security/audit-scope.toml"
]
